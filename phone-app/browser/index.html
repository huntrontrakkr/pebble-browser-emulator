<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pebble app settings</title>
    <style>
      html,
      body,
      #phone-screen {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }
      #configuration-page {
        position: absolute;
        border: 0;
        background: white;
        display: none;
      }
      #status {
        position: absolute;
        inset: 88px 20px auto;
        font: 14px/1.5 system-ui;
        color: #555;
      }
      #status:empty {
        display: none;
      }
      #open-external {
        position: absolute;
        bottom: 8px;
        right: 8px;
        padding: 8px 12px;
        font: 14px system-ui;
        background: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="phone-screen"></div>
    <iframe
      id="configuration-page"
      title="Watchface configuration"
      sandbox="allow-scripts allow-forms"
      referrerpolicy="no-referrer"
    ></iframe>
    <p id="status" role="status">Loading Pebble app…</p>
    <button id="open-external">Open in new tab</button>
    <script type="module" src="host.mjs"></script>
  </body>
</html>
