name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Finish a main release before starting the next one; cancel superseded PR builds.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run build:wasm
      - run: npm run build:phone
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      # Every gate, discovered rather than listed. Naming them here is what let
      # nineteen of twenty-five never run, including the configuration round
      # trip, so the suite now serves the built application once and runs
      # whatever is in scripts/. A gate needing locally supplied firmware or a
      # licensed package reports itself as not run instead of failing.
      - name: Prepare phone contract fixture
        run: |
          mkdir -p tmp/verify-all
          curl --fail --location --retry 3 --max-time 120 \
            https://registry.npmjs.org/pebble-clay/-/pebble-clay-1.0.4.tgz \
            --output tmp/pebble-clay-1.0.4.tgz
          # The phone contract verifies this archive against its pinned SHA-512.
      - name: Run browser gates with the download service
        run: |
          node services/resources/server.mjs > tmp/verify-all/resource-service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$PEBBLE_RESOURCE_SERVICE/v1/status"; then
              break
            fi
            kill -0 "$service_pid"
            sleep 1
          done
          curl --fail --silent "$PEBBLE_RESOURCE_SERVICE/v1/status"
          node scripts/verify-all.mjs
        env:
          PEBBLE_BROWSERS: chromium
          PEBBLE_CLAY_ARCHIVE: tmp/pebble-clay-1.0.4.tgz
          PEBBLE_RESOURCE_SERVICE: http://127.0.0.1:4318
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-gate-logs
          path: tmp/verify-all/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-browser-evidence
          path: tmp/pwa-browser/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-browser-evidence
          path: |
            tmp/model-browser/
            tmp/optics-browser/
            tmp/layered-optics/
            tmp/preview-inputs/
            tmp/phone-websocket-browser/results.json
          if-no-files-found: ignore
      - run: python -m pip install unicorn==2.1.4
      - run: python scripts/verify-reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: static-workbench
          path: dist/client/
      # Written only when both halves are configured. Without them the file is
      # absent and the published copy has no service at all, which is the
      # contract the static application is held to. The key reaches every
      # visitor's browser by design: it authorizes the relay and can be rotated
      # by publishing a new file, and is not a password.
      # The presence check is inside the step, not in its `if`: the secrets
      # context is not dependably available to a step-level condition, and a
      # condition that silently evaluated empty would publish a copy with no
      # service while looking like it had one.
      - name: Point the published copy at a relay
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ENDPOINT: ${{ vars.PEBBLE_SERVICE_ENDPOINT }}
          RELAY_KEY: ${{ secrets.PEBBLE_RELAY_KEY }}
        run: |
          if [ -n "$ENDPOINT" ] && [ -n "$RELAY_KEY" ]; then
            node scripts/write-service-config.mjs dist/client/service-config.json
          else
            echo 'No relay configured; publishing a copy with no service.'
          fi
      - name: Package tested website for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client/
  deploy:
    name: Publish GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish tested website
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: static-workbench
          path: dist/client/
      - name: Verify published files
        run: node scripts/verify-hosted-site.mjs
        env:
          PEBBLE_HOSTED_URL: ${{ steps.deployment.outputs.page_url }}
