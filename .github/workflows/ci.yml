name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Finish a main release before starting the next one; cancel superseded PR builds.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run build:wasm
      - run: npm run build:phone
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-pwa-browser.mjs
        env:
          PEBBLE_BROWSERS: chromium
      - run: node scripts/verify-model-browser.mjs
      - run: node scripts/verify-optics-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-browser-evidence
          path: tmp/pwa-browser/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-browser-evidence
          path: |
            tmp/model-browser/
            tmp/optics-browser/
          if-no-files-found: ignore
      - run: python -m pip install unicorn==2.1.4
      - run: python scripts/verify-reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: static-workbench
          path: dist/client/
      - name: Package tested website for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client/
  deploy:
    name: Publish GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish tested website
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: static-workbench
          path: dist/client/
      - name: Verify published files
        run: node scripts/verify-hosted-site.mjs
        env:
          PEBBLE_HOSTED_URL: ${{ steps.deployment.outputs.page_url }}
