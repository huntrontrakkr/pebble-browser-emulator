name: Phone spike
# Feasibility study for running the real companion stack (libpebble3) in the
# browser. It builds a tagged upstream release with a browser target added and
# reports what fails. It never gates or publishes anything.
on:
  push:
    branches: [claude/phone-app-maine-issue-nh431f]
    paths: ['tools/phone-spike/**', '.github/workflows/phone-spike.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream coredevices/mobileapp release tag'
        type: string
        required: false
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser builds of the storage libraries
        # Round 3 showed storage (Room over SQLite) is the one deep blocker.
        # Lists each library's latest release and the Kotlin targets it ships.
        run: bash tools/phone-spike/storage-versions.sh
      - name: Room 2 release sources
        # Round 13: whether the Room 2 upstream ships can be built for the browser.
        run: bash tools/phone-spike/room2-sources.sh
      - run: bash tools/phone-spike/prepare.sh
        env:
          PHONE_UPSTREAM_TAG: ${{ inputs.tag }}
      - name: Compile libpebble3 for the browser
        run: bash tools/phone-spike/build.sh tmp/phone-spike/upstream tmp/phone-spike/build.log
      - name: Blockers
        if: always()
        run: node tools/phone-spike/summarize.mjs tmp/phone-spike/build.log
      # Annotation-processor failures name only the element, so the processor's
      # own output and the failing tasks are shown in full.
      - name: Processor output
        if: always()
        run: |
          grep -n -E '\[ksp\]|^> Task .*FAILED|What went wrong' -A 12 tmp/phone-spike/build.log | head -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-spike-log
          path: tmp/phone-spike/build.log
