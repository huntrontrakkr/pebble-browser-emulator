name: Phone spike
# Feasibility study for running the real companion stack (libpebble3) in the
# browser. It builds a tagged upstream release with a browser target added and
# reports what fails. It never gates or publishes anything.
on:
  push:
    branches: [claude/phone-app-maine-issue-nh431f]
    paths:
      - 'tools/phone-spike/**'
      - '.github/workflows/phone-spike.yml'
      - 'src/app/libpebble-host.ts'
      - 'src/app/libpebble-pkjs.ts'
      - 'src/app/libpebble-network.ts'
      - 'src/app/phone-network.ts'
      - 'src/app/phone-websocket.ts'
      - 'src/app/libpebble.worker.ts'
      - 'src/app/upstream-phone.ts'
      - 'src/app/qemu.worker.ts'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream coredevices/mobileapp release tag'
        type: string
        required: false
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser builds of the storage libraries
        # Round 3 showed storage (Room over SQLite) is the one deep blocker.
        # Lists each library's latest release and the Kotlin targets it ships.
        run: bash tools/phone-spike/storage-versions.sh
      - name: Room 2 release sources
        # Round 13: whether the Room 2 upstream ships can be built for the browser.
        run: bash tools/phone-spike/room2-sources.sh
      - run: bash tools/phone-spike/prepare.sh
        env:
          PHONE_UPSTREAM_TAG: ${{ inputs.tag }}
      - name: Compile libpebble3 for the browser
        run: bash tools/phone-spike/build.sh tmp/phone-spike/upstream tmp/phone-spike/build.log
      - name: Blockers
        if: always()
        run: node tools/phone-spike/summarize.mjs tmp/phone-spike/build.log
      # The repository's packages (the QuickJS the phone runs PebbleKit JS in), the
      # watch core and the released firmware, for the first run and the end-to-end run.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Watch core and released firmware
        run: |
          npm ci
          npm run build:wasm
          mkdir -p tmp/phone-spike/firmware
          for role in micro spi; do
            curl -fsSL -o "tmp/phone-spike/firmware/qemu_emery_v4.37.0_${role}_flash.bin" \
              "https://github.com/coredevices/PebbleOS/releases/download/v4.37.0/qemu_emery_v4.37.0_${role}_flash.bin"
          done
      # Round 30: the linked library's first run, with the SQLite Wasm build and fflate
      # the page provides.
      - name: First run
        if: always()
        run: |
          dist=$(find tmp/phone-spike/upstream/libpebble3/build/dist -path '*productionLibrary*' -not -path '*/node_modules/*' -name '*.mjs' 2>/dev/null | head -1)
          [ -n "$dist" ] || { echo "no linked library"; exit 0; }
          npm install --silent --no-save --prefix tmp/phone-spike/run @sqlite.org/sqlite-wasm@3.53.4-build1 fflate@0.8.3
          ls -la "$(dirname "$dist")"
          # The library's own npm dependencies (kotlinx-datetime's js-joda and the like).
          cat "$(dirname "$dist")/package.json"
          (cd "$(dirname "$dist")" && npm install --silent --no-save --no-package-lock)
          timeout 120 node tools/phone-spike/run.mjs "$(dirname "$dist")" tmp/phone-spike/run || echo "run exit $?"
      - name: End to end with the released firmware
        run: |
          dist=$(find tmp/phone-spike/upstream/libpebble3/build/dist -path '*productionLibrary*' -not -path '*/node_modules/*' -name '*.mjs' 2>/dev/null | head -1)
          [ -n "$dist" ] || { echo "no linked library"; exit 0; }
          timeout 900 node tools/phone-spike/e2e.mjs "$(dirname "$dist")" tmp/phone-spike/run tmp/phone-spike/firmware || echo "e2e exit $?"
      # Round 40: the same run in Chromium, with the application's own QEMU and
      # libpebble3 phone workers.
      - name: In a browser
        run: |
          dist=$(find tmp/phone-spike/upstream/libpebble3/build/dist -path '*productionLibrary*' -not -path '*/node_modules/*' -name '*.mjs' 2>/dev/null | head -1)
          [ -n "$dist" ] || { echo "no linked library"; exit 0; }
          npx playwright install --with-deps chromium > /dev/null
          node tools/phone-spike/browser/bundle.mjs "$(dirname "$dist")" \
            tmp/phone-spike/run/node_modules/@sqlite.org/sqlite-wasm tmp/phone-spike/firmware tmp/phone-spike/browser
          timeout 900 node tools/phone-spike/browser/run.mjs tmp/phone-spike/browser 420 || echo "browser exit $?"
      # Round 42: Preview with the upstream phone published into the site.
      - name: Preview with the upstream phone
        run: |
          dist=$(find tmp/phone-spike/upstream/libpebble3/build/dist -path '*productionLibrary*' -not -path '*/node_modules/*' -name '*.mjs' 2>/dev/null | head -1)
          [ -n "$dist" ] || { echo "no linked library"; exit 0; }
          node tools/phone-spike/publish.mjs "$(dirname "$dist")" \
            tmp/phone-spike/run/node_modules/@sqlite.org/sqlite-wasm tmp/phone-spike/upstream
          cat public/libpebble3/manifest.json
          du -sh public/libpebble3 public/libpebble3/*.wasm public/libpebble3/libpebble3.js
          npx ng build > tmp/phone-spike/ng.log 2>&1 || { tail -60 tmp/phone-spike/ng.log; exit 0; }
          tail -25 tmp/phone-spike/ng.log
          timeout 300 node tools/phone-spike/browser/preview-check.mjs dist/client || echo "preview exit $?"
      # Round 45: Preview's own controls, end to end. JustTheTime is the pinned store
      # download (docs/STORE_WATCHFACE_TEST.md), fetched for this run only and checked
      # by hash; it is not kept or published.
      - name: Preview end to end
        run: |
          [ -f dist/client/libpebble3/libpebble3.js ] || { echo "no published phone"; exit 0; }
          curl -fsSL -o tmp/phone-spike/JustTheTime-1.2.pbw \
            'https://appstore-api.repebble.com/api/assets/pbw/50bdea7ee3ff48308157c046/1.2/1b2bf26b-122f-43f5-842f-1f852487a16f.pbw' \
            && export PEBBLE_STORE_PBW=tmp/phone-spike/JustTheTime-1.2.pbw || echo "store download failed"
          timeout 1800 node tools/phone-spike/browser/preview-e2e.mjs dist/client qemu_emery,qemu_flint,qemu_gabbro \
            || echo "preview e2e exit $?"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-e2e-screenshots
          path: preview-e2e-*.png
          if-no-files-found: ignore
      # Annotation-processor failures name only the element, so the processor's
      # own output and the failing tasks are shown in full.
      - name: Processor output
        if: always()
        run: |
          grep -n -E '\[ksp\]|^> Task .*FAILED|What went wrong' -A 12 tmp/phone-spike/build.log | head -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-spike-log
          path: tmp/phone-spike/build.log
