<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <style>
    :root { --case: #2a2521; --screen: #f4f1ec; }
    @media (prefers-color-scheme: dark) {
      :root { --case: #ece5da; --screen: #1c1a17; }
    }
  </style>
  <mask id="screen">
    <rect width="64" height="64" fill="#fff" />
    <rect x="18" y="15" width="28" height="34" rx="4" fill="#000" />
  </mask>
  <g mask="url(#screen)" fill="var(--case)">
    <rect x="11" y="7" width="42" height="50" rx="11" />
    <rect x="5" y="27" width="6" height="10" rx="2" />
    <rect x="53" y="15.5" width="6" height="9" rx="2" />
    <rect x="53" y="27.5" width="6" height="9" rx="2" />
    <rect x="53" y="39.5" width="6" height="9" rx="2" />
  </g>
</svg>
